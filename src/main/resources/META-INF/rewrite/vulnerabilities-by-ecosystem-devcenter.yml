---
type: specs.openrewrite.org/v1beta/recipe
name: io.moderne.devcenter.VulnerabilitiesByEcosystemDevCenter
displayName: DevCenter for Vulnerability Management by ecosystem
description: >-
  Track and fix vulnerable dependencies separately for each package ecosystem: Java (Maven and Gradle),
  npm, PyPI, and NuGet. Each ecosystem gets its own cards, and each card's fix action runs that
  ecosystem's own vulnerability remediation recipe. Copy this recipe to your own repository to drop
  ecosystems you don't use or rename the cards. Remove an ecosystem's check and its cards together.
recipeList:
  # Java cards scan Maven and Gradle dependencies themselves
  - io.moderne.devcenter.DependencyVulnerabilityCheck:
      measure: Severity
      cardName: Java vulnerabilities by Severity
  - io.moderne.devcenter.DependencyVulnerabilityCheck:
      measure: UpgradeDelta
      cardName: Java vulnerabilities by UpgradeDelta
  - io.moderne.devcenter.DependencyVulnerabilityCheck:
      measure: RiskScore
      cardName: Java vulnerabilities by RiskScore

  # Each ecosystem's check must run before its cards, which read its report
  - org.openrewrite.nodejs.security.DependencyVulnerabilityCheck:
      maximumUpgradeDelta: none
      transitiveFixStrategy: report
  - io.moderne.devcenter.EcosystemVulnerabilityCheck:
      ecosystem: Npm
      measure: Severity
  - io.moderne.devcenter.EcosystemVulnerabilityCheck:
      ecosystem: Npm
      measure: UpgradeDelta

  - org.openrewrite.python.dependencies.DependencyVulnerabilityCheck:
      maximumUpgradeDelta: none
  - io.moderne.devcenter.EcosystemVulnerabilityCheck:
      ecosystem: PyPI
      measure: Severity
  - io.moderne.devcenter.EcosystemVulnerabilityCheck:
      ecosystem: PyPI
      measure: UpgradeDelta

  # The NuGet check has no report-only mode, so the run also computes NuGet upgrades
  - org.openrewrite.csharp.dependencies.DependencyVulnerabilityCheck
  - io.moderne.devcenter.EcosystemVulnerabilityCheck:
      ecosystem: NuGet
      measure: Severity
  - io.moderne.devcenter.EcosystemVulnerabilityCheck:
      ecosystem: NuGet
      measure: UpgradeDelta

  - io.moderne.devcenter.FindOrganizationStatistics
  - org.openrewrite.search.FindCommitters
