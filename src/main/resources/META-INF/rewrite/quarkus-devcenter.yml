# DevCenter tracking Quarkus framework versions and best practices
type: specs.openrewrite.org/v1beta/recipe
name: io.moderne.devcenter.QuarkusDevCenter
displayName: DevCenter for Quarkus
description: |-
  A DevCenter that tracks the latest Quarkus framework versions and applies best practices.
  This DevCenter includes recipes to upgrade Quarkus versions, migrate from deprecated APIs,
  and ensure compatibility with the latest Java versions.

  **Move to Quarkus 3.40**<br/>
  The lowest version of any `io.quarkus:quarkus-*` dependency in each repository, compared to 3.40.x.<br/>
  `Major` → `Minor` → `Patch` → `Completed` · fix with [`UpgradeQuarkus3_x`](https://codegenomeproject.org/recipes/io.moderne.devcenter.UpgradeQuarkus3_x)

  **Move to the latest Quarkus Universe BOM**<br/>
  The version of the `io.quarkus:quarkus-universe-bom` parent POM, compared to 3.40.x.<br/>
  `Major` → `Minor` → `Patch` → `Completed` · fix with [`UpgradeQuarkusUniverseBom`](https://codegenomeproject.org/recipes/io.moderne.devcenter.UpgradeQuarkusUniverseBom)

  **Move to Java 25**<br/>
  The Java version each repository compiles for.<br/>
  `Java 8+` → `Java 11+` → `Java 17+` → `Java 21+` → `Completed` · fix with [`UpgradeToJava25`](https://codegenomeproject.org/recipes/org.openrewrite.java.migrate.UpgradeToJava25)

  **OWASP top ten**<br/>
  Issue occurrences per category, counted across all repositories.<br/>
  `A01 Broken access control` · `A02 Cryptographic failures` · `A03 Injection` · `A08 Software and data integrity failures` · fix with [`OwaspTopTen`](https://codegenomeproject.org/recipes/org.openrewrite.java.security.OwaspTopTen)

  The DevCenter also counts lines of code per repository and committers active in the last 90 days. See the [DevCenter documentation](https://docs.moderne.io/administrator-documentation/moderne-platform/how-to-guides/recipe-based-devcenter/) to customize.
recipeList:
  - io.moderne.devcenter.FindOrganizationStatistics
  - io.moderne.devcenter.FindActiveCommitters
  - io.moderne.devcenter.LibraryUpgrade:
      cardName: Move to Quarkus 3.40
      groupIdPattern: io.quarkus
      artifactIdPattern: quarkus-*
      version: 3.40.x
      upgradeRecipe: io.moderne.devcenter.UpgradeQuarkus3_x
  - io.moderne.devcenter.ParentPomUpgrade:
      cardName: Move to the latest Quarkus Universe BOM
      groupIdPattern: io.quarkus
      artifactIdPattern: quarkus-universe-bom
      version: 3.40.x
      upgradeRecipe: io.moderne.devcenter.UpgradeQuarkusUniverseBom
  - io.moderne.devcenter.JavaVersionUpgrade:
      majorVersion: 25
      upgradeRecipe: org.openrewrite.java.migrate.UpgradeToJava25
  - io.moderne.devcenter.SecurityStarter
---
type: specs.openrewrite.org/v1beta/recipe
name: io.moderne.devcenter.UpgradeQuarkus3_x
displayName: Upgrade to Quarkus 3.40
description: >-
  Upgrades Quarkus dependencies to version 3.40.x, including core, extensions, and tooling.
recipeList:
  - org.openrewrite.quarkus.quarkus2.Quarkus1to2Migration
  - org.openrewrite.maven.UpgradeDependencyVersion:
      groupId: io.quarkus
      artifactId: '*'
      newVersion: 3.40.x
  - org.openrewrite.maven.UpgradeDependencyVersion:
      groupId: io.quarkus.platform
      artifactId: '*'
      newVersion: 3.40.x
---
type: specs.openrewrite.org/v1beta/recipe
name: io.moderne.devcenter.UpgradeQuarkusUniverseBom
displayName: Upgrade Quarkus Universe BOM
description: >-
  Upgrades the Quarkus Universe BOM parent to the latest version.
recipeList:
  - org.openrewrite.maven.UpgradeParentVersion:
      groupId: io.quarkus
      artifactId: quarkus-universe-bom
      newVersion: x
