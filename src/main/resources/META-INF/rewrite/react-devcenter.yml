---
type: specs.openrewrite.org/v1beta/recipe
name: io.moderne.devcenter.DevCenterReactStarter
displayName: DevCenter for React
description: |-
  A default DevCenter configuration for React repositories.
  Track React version adoption and package migrations across your organization.

  **Move to React 19**<br/>
  The `react` version each project resolves, or the lower bound it declares.<br/><img src="data:image/svg+xml;base64," alt="Major to Completed" /><br/>
  `Major` → `Minor` → `Patch` → `Completed` · fix with [`upgrade-to-react-19`](https://codegenomeproject.org/recipes/org.openrewrite.react.migrate.upgrade-to-react-19)

  **Move from `node-sass` to `sass`**<br/>
  Whether each project depends on the deprecated `node-sass`, Dart Sass (`sass`) or both.<br/><img src="data:image/svg+xml;base64," alt="Not started to Completed" /><br/>
  `Not started` → `In progress` → `Completed` · fix with [`replace-node-sass-with-sass`](https://codegenomeproject.org/recipes/org.openrewrite.angular.migration.replace-node-sass-with-sass)

  **Move from Jest to Vitest**<br/>
  Whether each project depends on `jest`, `vitest` or both.<br/><img src="data:image/svg+xml;base64," alt="Not started to Completed" /><br/>
  `Not started` → `In progress` → `Completed`

  The DevCenter also counts lines of code per repository and committers active in the last 90 days. See the [DevCenter documentation](https://docs.moderne.io/administrator-documentation/moderne-platform/how-to-guides/recipe-based-devcenter/) to customize.
recipeList:
  - io.moderne.devcenter.PackageUpgrade:
      cardName: Move to React 19
      packagePattern: react
      version: 19.0.0
      upgradeRecipe: org.openrewrite.react.migrate.upgrade-to-react-19
  - io.moderne.devcenter.PackageMigration:
      cardName: Move from `node-sass` to `sass`
      fromPackagePattern: node-sass
      toPackagePattern: sass
      migrationRecipe: org.openrewrite.angular.migration.replace-node-sass-with-sass
  - io.moderne.devcenter.PackageMigration:
      cardName: Move from Jest to Vitest
      fromPackagePattern: jest
      toPackagePattern: vitest
  - io.moderne.devcenter.FindOrganizationStatistics
  - io.moderne.devcenter.FindActiveCommitters
