type: specs.openrewrite.org/v1beta/recipe
name: io.moderne.devcenter.OrganizationStatisticsReport
displayName: Organization statistics report
description: >-
  Counts lines of code per repository and lists the committers active in the last 90 days, the two
  statistics a DevCenter reports for an organization, without any DevCenter cards.
  Run it on its own to produce those statistics for an organization.
recipeList:
  - io.moderne.devcenter.FindOrganizationStatistics
  - io.moderne.devcenter.FindActiveCommitters
