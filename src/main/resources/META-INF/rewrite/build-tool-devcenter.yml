---
type: specs.openrewrite.org/v1beta/recipe
name: io.moderne.devcenter.BuildToolStarter
displayName: DevCenter for Gradle and Maven
description: |-
  Track and automate upgrades for Gradle, Maven, and Java versions.

  **Upgrade to Gradle 9**<br/>
  The Gradle version each repository builds with, compared to 9.0.0.<br/><img src="data:image/svg+xml;base64," alt="Major to Completed" /><br/>
  `Major` → `Minor` → `Patch` → `Completed` · fix with [`MigrateToGradle9`](https://codegenomeproject.org/recipes/org.openrewrite.gradle.MigrateToGradle9)

  **Upgrade to Maven 4**<br/>
  The Maven version each repository builds with, compared to 4.0.0.<br/><img src="data:image/svg+xml;base64," alt="Major to Completed" /><br/>
  `Major` → `Minor` → `Patch` → `Completed` · fix with [`UpdateMavenWrapper`](https://codegenomeproject.org/recipes/org.openrewrite.maven.UpdateMavenWrapper)

  **Move to Java 25**<br/>
  The Java version each repository compiles for.<br/><img src="data:image/svg+xml;base64," alt="Java 8+ to Completed" /><br/>
  `Java 8+` → `Java 11+` → `Java 17+` → `Java 21+` → `Completed` · fix with [`UpgradeToJava25`](https://codegenomeproject.org/recipes/org.openrewrite.java.migrate.UpgradeToJava25)

  The DevCenter also counts lines of code per repository and committers active in the last 90 days. See the [DevCenter documentation](https://docs.moderne.io/administrator-documentation/moderne-platform/how-to-guides/recipe-based-devcenter/) to customize.
recipeList:
  - io.moderne.devcenter.FindOrganizationStatistics
  - io.moderne.devcenter.FindActiveCommitters
  - io.moderne.devcenter.BuildToolCard:
      cardName: Upgrade to Gradle 9
      buildTool: Gradle
      targetVersion: 9.0.0
      fixRecipeId: org.openrewrite.gradle.MigrateToGradle9
  - io.moderne.devcenter.BuildToolCard:
      cardName: Upgrade to Maven 4
      buildTool: Maven
      targetVersion: 4.0.0
      fixRecipeId: org.openrewrite.maven.UpdateMavenWrapper
  - io.moderne.devcenter.JavaVersionUpgrade:
      majorVersion: 25
      upgradeRecipe: org.openrewrite.java.migrate.UpgradeToJava25
