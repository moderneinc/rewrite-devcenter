---
type: specs.openrewrite.org/v1beta/recipe
name: io.moderne.devcenter.SonarDevCenter
displayName: Sonar DevCenter
description: |-
  A DevCenter that counts the Sonar issues the Sonar rule recipes of rewrite-static-analysis,
  rewrite-testing-frameworks and rewrite-migrate-java find and fix, by Sonar severity.

  **Sonar issues by severity**<br/>
  Issue occurrences per Sonar severity, counted across all repositories.<br/><img src="data:image/svg+xml;base64," alt="5 severities" /><br/>
  `Sonar blocker issues` · `Sonar critical issues` · `Sonar major issues` · `Sonar minor issues` · `Sonar info issues` · fix with [`FixSonarIssues`](https://codegenomeproject.org/recipes/io.moderne.devcenter.FixSonarIssues)

  A few recipes cover Sonar rules of more than one severity, such as `HiddenField` (blocker and major). The
  severities run from blocker to info, so such an issue is counted once, under the highest severity it has.
  The fix applies every Sonar rule at once. To fix one severity at a time, run that severity's recipe instead.

  The DevCenter also counts lines of code per repository and committers active in the last 90 days. A DevCenter
  holds one security card, so this one is a DevCenter of its own, separate from the starter DevCenter and its OWASP
  top ten card. See the [DevCenter documentation](https://docs.moderne.io/administrator-documentation/moderne-platform/how-to-guides/recipe-based-devcenter/) to customize.
recipeList:
  - io.moderne.devcenter.SonarIssues
  - io.moderne.devcenter.FindOrganizationStatistics
  - io.moderne.devcenter.FindActiveCommitters
---
type: specs.openrewrite.org/v1beta/recipe
name: io.moderne.devcenter.SonarIssues
displayName: Sonar issues by severity
description: >-
  Issue occurrences per Sonar severity, counted across all repositories. Each severity collects the Sonar rule
  recipes of rewrite-static-analysis, rewrite-testing-frameworks and rewrite-migrate-java for that severity. A
  recipe that covers Sonar rules of more than one severity is counted under the highest of them, which runs first.
recipeList:
  # Changes made by recipes above this one in the recipe list are reported as occurrences
  # in the Security DevCenter card, one measure per recipe, in this order.
  - io.moderne.devcenter.SonarBlocker
  - io.moderne.devcenter.SonarCritical
  - io.moderne.devcenter.SonarMajor
  - io.moderne.devcenter.SonarMinor
  - io.moderne.devcenter.SonarInfo
  - io.moderne.devcenter.ReportAsSecurityIssues:
      fixRecipe: io.moderne.devcenter.FixSonarIssues
