---
type: specs.openrewrite.org/v1beta/recipe
name: io.moderne.devcenter.ClassCohesionDevCenter
displayName: Class cohesion DevCenter
description: |-
  A DevCenter that grades the maintainability, cohesion, and test gaps of each repository,
  based on the class quality metrics and test gaps computed by Moderne Prethink.

  **Average Class Maintainability**<br/>
  The maintainability index (0-100) averaged across all classes in each repository.<br/><img src="data:image/svg+xml;base64," alt="F to A" /><br/>
  `F` (0+) → `D` (20+) → `C` (40+) → `B` (60+) → `A` (80+)

  **Average Class Cohesion**<br/>
  LCOM4 (Lack of Cohesion of Methods, version 4) averaged across all classes in each repository; lower is more cohesive.<br/><img src="data:image/svg+xml;base64," alt="LOW to HIGH" /><br/>
  `LOW` (10+) → `MEDIUM` (3+) → `HIGH` (0+)

  **Test Gaps Risk**<br/>
  The risk scores of public, non-trivial methods without tests, summed per repository.<br/><img src="data:image/svg+xml;base64," alt="LOW to HIGH" /><br/>
  `LOW` (0+) → `MEDIUM` (3+) → `HIGH` (10+)

  The DevCenter also counts lines of code per repository and committers active in the last 90 days. See the [DevCenter documentation](https://docs.moderne.io/administrator-documentation/moderne-platform/how-to-guides/recipe-based-devcenter/) to customize.
recipeList:
  - io.moderne.devcenter.FindOrganizationStatistics
  - io.moderne.devcenter.FindActiveCommitters

  # 1. Populate ClassQualityMetrics by running Prethink's class metrics recipe.
  - io.moderne.prethink.quality.FindClassMetrics
  - io.moderne.prethink.testing.coverage.FindTestGaps

  # 2. Read the LCOM4 column from that data table, average it across all
  #    classes in the repo, and bucket the result.
  - io.moderne.devcenter.BucketedMetricCard:
      inputDataTable: io.moderne.prethink.table.ClassQualityMetrics
      cardName: Average Class Maintainability
      column: maintainabilityIndex
      aggregation: average
      buckets:
      - name: F
        moreThan: 0
      - name: D
        moreThan: 20
      - name: C
        moreThan: 40
      - name: B
        moreThan: 60
      - name: A
        moreThan: 80

  - io.moderne.devcenter.BucketedMetricCard:
      inputDataTable: io.moderne.prethink.table.ClassQualityMetrics
      cardName: Average Class Cohesion
      column: lcom4
      aggregation: average
      buckets:
      - name: LOW
        moreThan: 10
      - name: MEDIUM
        moreThan: 3
      - name: HIGH
        moreThan: 0
  
  - io.moderne.devcenter.BucketedMetricCard:
      inputDataTable: io.moderne.prethink.table.TestGaps
      cardName: Test Gaps Risk
      column: riskScore
      aggregation: sum
      buckets:
      - name: LOW
        moreThan: 0
      - name: MEDIUM
        moreThan: 3
      - name: HIGH
        moreThan: 10